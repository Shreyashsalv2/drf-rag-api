services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/rag
      DJANGO_SECRET_KEY: change-me-in-production
      # GROQ_API_KEY: set this (or GEMINI_API_KEY) to get LLM-written answers
    ports:
      - "8000:8000"
    volumes:
      - index:/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  index:
